name: CargoTest

on:
  pull_request:
    branches: [ "master", "develop" ]
  push:
    branches: [ "master", "develop" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      SQLX_OFFLINE: "true"

    steps:
    - uses: actions/checkout@v4

    # Common Rust environment setup (toolchain, cache, sqlx CLI)
    - uses: ./.github/actions/setup-rust

    - name: Run tests with test containers
      run: cargo test --verbose
      
    - name: Run clippy
      run: cargo clippy -- -D warnings
      
    - name: Check formatting
      run: cargo fmt -- --check