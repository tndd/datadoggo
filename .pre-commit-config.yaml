repos:
  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt (auto-fix)
        entry: bash -c 'cargo fmt --all && git add $(git diff --name-only)'
        language: system
        types_or: [rust, toml]
        pass_filenames: false
        always_run: true
      - id: cargo-check
        name: cargo check
        entry: bash -c 'SQLX_OFFLINE=true cargo check --all --locked --tests'
        language: system
        pass_filenames: false
